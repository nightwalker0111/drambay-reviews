<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try Your Tiles | Drambay Rooms Studio</title>
<meta name="description" content="Choose your tiles and see them laid across a whole room.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F2EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Try Tiles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --red:#D71920; --ink:#343A3B; --bg:#F5F2EC; --stone:#D9D2C7; --white:#fff; --muted:#6F7574; --night:#16191A;
  --display:'Newsreader', Georgia, 'Times New Roman', serif; --text:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--text); }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.top { display: flex; align-items: center; gap: 14px; padding: 18px 0 6px; }
header.top img { width: 36px; height: auto; display: block; }
header.top h1 { font: 400 26px/1.1 var(--display); margin: 0; letter-spacing: -.01em; flex: 1; }
.quiet { border: 1px solid var(--stone); background: transparent; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.quiet[hidden] { display: none; }
.quiet.done { border-color: transparent; color: var(--muted); padding-right: 0; }
.pickrow { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--white); border: 1px solid transparent; border-radius: 14px; padding: 8px 12px 8px 8px; min-width: 0; min-height: 64px; }
.slot:focus-visible, .quiet:focus-visible, .act:focus-visible, .dice:focus-visible, .round:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.slot .sw { width: 48px; height: 48px; border-radius: 9px; background: var(--stone) center/cover; flex: none; }
.slot span { min-width: 0; display: block; }
.slot small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.slot b { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.pairc .sw { background-size: 50% 100%, 50% 100%; background-position: left center, right center; background-repeat: no-repeat; }
.dice { border: 0; border-radius: 14px; background: var(--ink); color: #fff; padding: 0 20px; font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 10px; white-space: nowrap; min-height: 48px; }
.dice svg { transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.dice.spin svg { transform: rotate(180deg); }
.grid { display: flex; gap: 18px; align-items: flex-start; padding: 8px 0 40px; }
.col { flex: 1 1 0; min-width: 0; display: grid; gap: 18px; }
.card { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: transparent; text-align: left; }
.card .ph { display: block; position: relative; border-radius: 16px; overflow: hidden; background: var(--stone); }
.card canvas, .card img { display: block; width: 100%; height: auto; }
.card img { position: absolute; inset: 0; height: 100%; object-fit: cover; filter: blur(14px) saturate(.6); transform: scale(1.1); transition: opacity .5s; }
.card.ready img { opacity: 0; }
.card .nm { display: block; font: 400 17px/1.3 var(--display); padding: 10px 2px 0; }
.note { color: var(--muted); font-size: 13px; padding: 0 0 36px; max-width: 60ch; margin: 0; }
/* full-screen view */
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--night); display: none; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
.viewer.on { display: block; }
.vbg { position: absolute; inset: -60px; background: center/cover no-repeat; filter: blur(34px) brightness(.42) saturate(.8); }
.stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.stage:active { cursor: grabbing; }
.frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); will-change: transform, opacity; }
.frame.anim { transition: transform .22s cubic-bezier(.2,.7,.2,1), opacity .22s; }
.frame canvas { display: block; }
.chrome { transition: opacity .25s; }
.viewer.bare .chrome { opacity: 0; pointer-events: none; }
.vtop { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; pointer-events: none;
  padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); }
.vtop > * { pointer-events: auto; }
.glass { background: rgba(22,25,26,.52); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; border: 0; }
.where { margin-right: auto; border-radius: 999px; padding: 10px 18px; font: 400 17px/1.2 var(--display); display: flex; align-items: baseline; gap: 12px; }
.where i { font: 500 13px/1 var(--text); font-style: normal; opacity: .72; white-space: nowrap; }
.vbtn { height: 44px; min-width: 44px; border-radius: 999px; font-size: 14px; font-weight: 500; padding: 0 16px; display: grid; place-items: center; }
.vbtn[hidden] { display: none; }
.vbtn.x { padding: 0; }
.vbtn[aria-pressed="true"] { background: #fff; color: var(--ink); }
.nav { position: absolute; top: 50%; margin-top: -28px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
.nav.prev { left: calc(16px + env(safe-area-inset-left)); } .nav.next { right: calc(16px + env(safe-area-inset-right)); }
.bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(1040px, calc(100% - 28px));
  background: rgba(245,242,236,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 20px; padding: 8px 14px 8px 8px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; column-gap: 26px; }
.bar .slot { min-height: 52px; padding: 6px 10px 6px 6px; gap: 10px; }
.bar .slot .sw { width: 40px; height: 40px; }
.round { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--stone); background: var(--white); display: grid; place-items: center; padding: 0; }
.acts { display: flex; gap: 10px; align-items: center; }
.act { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 15px; background: var(--ink); color: #fff; white-space: nowrap; min-height: 48px; }
.act.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; font-weight: 500; background: transparent; color: var(--ink); border: 1px solid var(--stone); display: flex; align-items: center; gap: 7px; }
/* 360 display hall */
.hall { position: fixed; inset: 0; z-index: 15; background: #B3ABA0; display: none; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
.hall.on { display: block; }
.hall canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.hall .nav { top: var(--ringy, 90%); margin-top: -24px; width: 48px; height: 48px; }
.hall .nav.prev { left: calc(50% - 150px); } .hall .nav.next { right: calc(50% - 150px); }
.hall .nav, .hall .vtop { transition: opacity .25s; }
.hall.going .nav, .hall.going .vtop { opacity: 0; pointer-events: none; }
.hsh { display: flex; gap: 8px; align-items: center; } .hsh svg { transition: transform .5s cubic-bezier(.2,.7,.2,1); } .hsh.spin svg { transform: rotate(180deg); }
.hall button.where { align-items: center; gap: 9px; cursor: pointer; }
.hall button.where svg { opacity: .8; transition: transform .2s; } .hall button.where[aria-expanded="true"] svg { transform: rotate(180deg); }
.hall button.where i { margin-left: 3px; }
.hmenu { position: absolute; z-index: 2; left: calc(16px + env(safe-area-inset-left)); top: calc(68px + env(safe-area-inset-top)); border-radius: 20px; padding: 6px; display: grid; min-width: 232px; }
.hmenu[hidden], .hall.going .hmenu { display: none; }
.hmenu button { border: 0; background: none; color: #fff; text-align: left; font: 400 17px/1.2 var(--display); padding: 12px 14px; border-radius: 14px; min-height: 46px; }
.hmenu button[aria-current="true"] { background: rgba(255,255,255,.17); }
.nav[hidden] { display: none; }
.viewer.fo #swap { display: none; }
@media (max-width: 520px){ .hsh span { display: none; } .hsh { padding: 0 13px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.viewer.fadein { animation: vin .36s ease both; }
@keyframes vin { from { opacity: 0; } to { opacity: 1; } }
.note button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
/* picker */
.vlogo { display: none; }
.viewer.one .vlogo { display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(22,25,26,.78); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.vlogo img { height: 26px; width: auto; display: block; }
.viewer.one #vshuffle, .viewer.one #swap { display: none; }
.viewer.one .picks .slot { grid-column: span 2; }
.hall.home:not(.exit) #hclose, .hall.one #hshuffle, .hall.one #hspace svg { display: none; } .hall.one #hspace { cursor: default; margin-right: auto; }
@media (max-width: 520px){ .viewer.one .vtop { flex-wrap: wrap; } .viewer.one .vlogo { margin-right: auto; } .viewer.one .where { order: 5; margin-right: 0; } }
.zb { display: flex; gap: 8px; align-items: center; }
.vsh svg { transition: transform .5s cubic-bezier(.2,.7,.2,1); } .vsh.spin svg { transform: rotate(180deg); }
.zoom { position: fixed; inset: 0; z-index: 25; display: none; background: rgba(16,18,19,.66); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
.zoom.on { display: block; animation: zin .22s ease-out; }
@keyframes zin { from { opacity: 0; } to { opacity: 1; } }
.zstage { position: absolute; inset: 0; perspective: 1400px; cursor: zoom-in; }
.zoom.zin .zstage { cursor: grab; }
.ztile { position: absolute; left: 50%; top: 50%; }
.zfloat { position: absolute; inset: 0; animation: zfloat 7s ease-in-out infinite; box-shadow: 0 46px 80px -18px rgba(0,0,0,.62), 0 14px 26px -10px rgba(0,0,0,.4); background: #D9D2C7; }
.zoom.zin .zfloat { animation: none; box-shadow: none; }
@keyframes zfloat { 0%, 100% { transform: translateY(5px) rotateX(2.2deg) rotateY(-3deg); } 50% { transform: translateY(-7px) rotateX(-1.6deg) rotateY(3deg); } }
.zfloat img { position: absolute; left: 50%; top: 50%; display: block; max-width: none; pointer-events: none; }
.ztabs { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; padding: 6px; border-radius: 16px; max-width: calc(100% - 28px); overflow-x: auto; background: rgba(22,25,26,.52); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.ztabs:empty { display: none; }
.ztabs button { flex: none; width: 52px; height: 52px; border-radius: 10px; border: 2px solid transparent; background: #D9D2C7 center / cover; padding: 0; }
.ztabs button[aria-pressed="true"] { border-color: #fff; }
.ztabs span { flex: none; align-self: center; color: #fff; font: 500 12px/1 var(--text); opacity: .78; padding: 0 4px 0 8px; white-space: nowrap; }
@media (max-width: 520px){ .zb span { display: none; } .zb { padding: 0 13px; } .ztabs button { width: 44px; height: 44px; } }
.sheet { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(22,25,26,.45); }
.sheet.on { display: block; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: 86vh; height: 86dvh; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
.panel > * { flex: none; }
.panel header { display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px; }
.panel h2 { font: 400 22px/1.2 var(--display); margin: 0; flex: 1; }
.panel input { width: 100%; border: 1px solid var(--stone); background: var(--white); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.search { padding: 4px 16px 12px; }
.chips { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips[hidden] { display: none; }
.chips button { flex: none; border: 1px solid var(--stone); background: transparent; border-radius: 999px; padding: 8px 15px; font-size: 14px; line-height: 1.3; white-space: nowrap; min-height: 38px; }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.panel .list { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 6px 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; align-content: start; }
.tile { border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; }
.tile i { display: block; aspect-ratio: 2/1; border-radius: 10px; background: var(--stone) center/cover; }
.tile.sq i { aspect-ratio: 1/1; max-width: 60%; }
.tile b { display: block; font-weight: 500; font-size: 14px; padding-top: 6px; line-height: 1.25; }
.tile small { color: var(--muted); font-size: 12px; }
.tile[aria-current="true"] i { outline: 2px solid var(--red); outline-offset: 2px; }
.empty { color: var(--muted); font-size: 14px; grid-column: 1 / -1; margin: 8px 0; }
.toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; }
@media (max-width: 720px) {
  header.top h1 { font-size: 22px; }
  .pickrow { grid-template-columns: minmax(0, 1fr); }
  .slot { flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px; min-height: 0; }
  .slot .sw { width: 100%; height: 44px; }
  .slot span { width: 100%; } .slot small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }      /* never wider than the phone */
  .dice { justify-content: center; }
  .bar { grid-template-columns: auto minmax(0, 1fr); row-gap: 8px; column-gap: 12px; padding: 8px; }
  .bar .picks { grid-column: 1 / -1; gap: 6px; }
  .bar .slot { gap: 5px; padding: 6px 8px 7px; min-height: 0; }
  .bar .slot .sw { width: 100%; height: 22px; border-radius: 6px; }
  .bar .slot b { font-size: 13px; } .bar .slot small { font-size: 11px; white-space: nowrap; }
  .acts { justify-self: end; }
  .nav { width: 44px; height: 44px; margin-top: -60px; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  .where { font-size: 15px; padding: 9px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .zfloat, .zoom.on { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="d-logo.png" alt="Drambay" width="36" height="34" crossorigin="anonymous">
    <h1>Try Your Tiles</h1>
    <button class="quiet" id="install" hidden>Install app</button>
    <button class="quiet" id="offline">Save for offline</button>
  </header>
  <div class="pickrow">
    <section class="picks" id="picks" aria-label="Your tiles"></section>
    <button class="dice" id="shuffle" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c5 0 6 10 11 10H21"/><path d="M3 17h3.5c1.6 0 2.8-1 3.9-2.4M13.6 9.4C14.7 8 15.9 7 17.5 7H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span>Surprise me</span></button>
  </div>
  <main class="grid" id="grid"></main>
  <p class="note">These rooms are design visualisations. The tile faces are the real Drambay designs. Shade and gloss are best confirmed on the tile itself at the showroom. <button id="walk" type="button">Open the 360° display hall</button></p>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Room, full screen">
  <div class="vbg" id="vbg"></div>
  <div class="stage" id="stage"><div class="frame" id="frame"></div></div>
  <div class="vtop chrome">
    <span class="vlogo"><img data-asset="logo-white.svg" alt="Drambay Tiles &amp; Sanitary Ware"></span>
    <span class="where glass"><b id="vname" style="font-weight:400"></b><i id="vcount"></i></span>
    <button class="vbtn glass zb" id="zoomb" type="button" aria-label="See the tile close up"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6M10.5 8v5M8 10.5h5"/></svg><span>Tile close-up</span></button>
    <button class="vbtn x glass" id="close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <button class="nav prev glass chrome" id="prev" type="button" aria-label="Previous room"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav next glass chrome" id="next" type="button" aria-label="Next room"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="bar chrome">
    <section class="picks" id="vpicks" aria-label="Your tiles"></section>
    <button class="round" id="swap" type="button" title="Swap the wall and the highlighter wall" aria-label="Swap the wall and the highlighter wall"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></svg></button>
    <div class="acts">
      <button class="act sm vsh" id="vshuffle" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c5 0 6 10 11 10H21"/><path d="M3 17h3.5c1.6 0 2.8-1 3.9-2.4M13.6 9.4C14.7 8 15.9 7 17.5 7H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Surprise me</button>
      <button class="act" id="share" type="button">Share picture</button>
    </div>
  </div>
</div>

<div class="hall" id="hall" role="dialog" aria-modal="true" aria-label="Display hall. Drag to look around.">
  <canvas id="hallcv"></canvas>
  <div class="vtop">
    <button class="where glass" id="hspace" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="hmenu"><b id="hsname" style="font-weight:400">Bathrooms</b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg><i id="hcount"></i></button>
    <button class="vbtn glass hsh" id="hshuffle" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c5 0 6 10 11 10H21"/><path d="M3 17h3.5c1.6 0 2.8-1 3.9-2.4M13.6 9.4C14.7 8 15.9 7 17.5 7H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span>Surprise me</span></button>
    <button class="vbtn x glass" id="hclose" type="button" aria-label="Close the display hall"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <div class="hmenu glass" id="hmenu" role="menu" aria-label="Choose a space" hidden></div>
  <button class="nav prev glass" id="hprev" type="button" aria-label="Previous display"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav next glass" id="hnext" type="button" aria-label="Next display"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="sr" id="hstep" type="button">Step into this bathroom</button>
</div>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Tile close-up">
  <div class="zstage" id="zstage"><div class="ztile" id="ztile"><div class="zfloat" id="zfloat"><img id="zimg" alt="" draggable="false"></div></div></div>
  <div class="vtop">
    <span class="where glass"><b id="zname" style="font-weight:400"></b><i id="zmeta"></i></span>
    <button class="vbtn x glass" id="zclose" type="button" aria-label="Close the close-up"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <div class="ztabs" id="ztabs"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel">
    <header><h2 id="sheetTitle">Floor tile</h2><button class="quiet" id="sheetClose">Done</button></header>
    <div class="search"><input id="q" type="search" placeholder="Search by name or code" autocomplete="off" aria-label="Search tiles"></div>
    <div class="chips" id="sizes" aria-label="Size"></div>
    <div class="chips" id="fins" aria-label="Finish"></div>
    <div class="chips" id="pairf" aria-label="Crisscross pairs" hidden></div>
    <div class="list" id="list"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
